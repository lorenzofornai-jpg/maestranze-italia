# Ambiente del Codespace: l'app (Node 22), il database e la casella di posta di prova.
services:
  app:
    image: mcr.microsoft.com/devcontainers/javascript-node:1-22-bookworm
    volumes:
      - ../..:/workspaces:cached
    command: sleep infinity
    environment:
      DATABASE_URL: postgres://maestranze:maestranze@db:5432/maestranze
      TEST_DATABASE_URL: postgres://maestranze:maestranze@db:5432/maestranze_test
      SMTP_URL: smtp://mailpit:1025
    depends_on:
      - db
      - mailpit

  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: maestranze
      POSTGRES_PASSWORD: maestranze
      POSTGRES_DB: maestranze
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro

  mailpit:
    image: axllent/mailpit:v1.21
    restart: unless-stopped

volumes:
  pgdata:
